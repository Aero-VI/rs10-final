<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScape 10</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; overflow: hidden; background-color: #000; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- Top left: Stats/HP -->
        <div id="top-bar">
            <div class="orb hp-orb">❤ 10</div>
            <div class="orb prayer-orb">✨ 1</div>
            <div class="orb run-orb">🏃 100</div>
        </div>

        <!-- Bottom left: Chat -->
        <div id="chat-box">
            <div class="chat-messages">
                <p><span class="sys">Welcome to RuneScape 10.</span></p>
                <p><span class="sys">The graphics are finally good.</span></p>
            </div>
            <div class="chat-input">Press Enter to chat...</div>
        </div>

        <!-- Right side: Minimap and Panels -->
        <div id="right-panel-container">
            <div id="minimap-border">
                <div id="minimap-inner">
                    <!-- Minimap canvas would go here -->
                </div>
            </div>
            <div id="side-panel">
                <div class="panel-tabs">
                    <button class="tab active">🎒</button>
                    <button class="tab">⚔️</button>
                    <button class="tab">📊</button>
                    <button class="tab">⚙️</button>
                </div>
                <div class="panel-content">
                    <div class="inventory-grid">
                        <!-- 28 slots -->
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.128.0';
        import { EffectComposer } from 'https://esm.sh/three@0.128.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://esm.sh/three@0.128.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://esm.sh/three@0.128.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0f0a); // Dark, moody evening
        scene.fog = new THREE.FogExp2(0x1a0f0a, 0.015);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Camera setup (isometric)
        const aspect = window.innerWidth / window.innerHeight;
        const d = 20;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0x2a2a3a, 0x0f0a05, 0.4);
        scene.add(hemiLight);

        // Sun / God ray source
        const dirLight = new THREE.DirectionalLight(0xffaa55, 1.5);
        dirLight.position.set(40, 30, -40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Local Point Lights (Torches)
        function createTorch(x, z) {
            const light = new THREE.PointLight(0xff6600, 2, 15);
            light.position.set(x, 2, z);
            light.castShadow = true;
            scene.add(light);
            return light;
        }
        createTorch(-8, -8);
        createTorch(8, -8);

        // Post-Processing (Bloom for glowing effects)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.5;
        bloomPass.strength = 1.2; // Intense bloom like the screenshot
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Procedural Textures
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2b3b14'; ctx.fillRect(0, 0, 512, 512); // Darker base grass
            for(let i=0; i<30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#1a2a0a' : '#3a4d13';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 6);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(20, 20);
            return tex;
        }

        function createCobbleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 512, 512);
            for(let i=0; i<800; i++) {
                const gray = 60 + Math.random()*50;
                ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                ctx.beginPath();
                ctx.ellipse(Math.random()*512, Math.random()*512, 8+Math.random()*12, 6+Math.random()*8, Math.random()*Math.PI, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }
        
        function createStoneWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#555'; ctx.fillRect(0, 0, 512, 512);
            for(let y=0; y<512; y+=32) {
                for(let x=0; x<512; x+=64) {
                    const offset = (y/32)%2===0 ? 0 : 32;
                    const gray = 80 + Math.random()*40;
                    ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
                    ctx.fillRect(x + offset + 2, y + 2, 60, 28);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }
        
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4a2f1d'; ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<200; i++) {
                ctx.fillStyle = '#3a2010';
                ctx.fillRect(0, Math.random()*256, 256, 1 + Math.random()*3);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const grassTex = createGrassTexture();
        const cobbleTex = createCobbleTexture();
        const stoneWallTex = createStoneWallTexture();
        const woodTex = createWoodTexture();

        // World Generation
        const groundGeo = new THREE.PlaneGeometry(160, 160);
        const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95, metalness: 0.05 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Town Square
        const squareGeo = new THREE.PlaneGeometry(40, 40);
        const squareMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.8, metalness: 0.1 });
        const square = new THREE.Mesh(squareGeo, squareMat);
        square.rotation.x = -Math.PI / 2;
        square.position.y = 0.05;
        square.receiveShadow = true;
        scene.add(square);
        
        // Central Fountain
        const fountainGeo = new THREE.CylinderGeometry(3, 4, 1.5, 16);
        const fountainMat = new THREE.MeshStandardMaterial({ map: stoneWallTex });
        const fountain = new THREE.Mesh(fountainGeo, fountainMat);
        fountain.position.set(0, 0.75, 0);
        fountain.castShadow = true;
        fountain.receiveShadow = true;
        scene.add(fountain);
        
        const waterGeo = new THREE.CylinderGeometry(2.8, 2.8, 1.6, 16);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.8 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(0, 0.8, 0);
        scene.add(water);

        // Buildings
        function createBuilding(w, h, d, x, z, tex) {
            const group = new THREE.Group();
            
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, h/2, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            
            const roofGeo = new THREE.ConeGeometry(w*0.8, h*0.6, 4);
            const roofMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, h + h*0.3, 0);
            roof.rotation.y = Math.PI/4;
            roof.castShadow = true;
            group.add(roof);
            
            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        createBuilding(12, 10, 12, -15, -15, stoneWallTex); // Bank
        createBuilding(10, 8, 10, 15, -15, stoneWallTex); // Shop
        createBuilding(8, 7, 8, -15, 15, stoneWallTex); // Cook

        // Environment Props
        

        function createBarrels(x, z) {
            const barrelGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 12);
            const barrelMat = new THREE.MeshStandardMaterial({ map: woodTex });
            const barrel1 = new THREE.Mesh(barrelGeo, barrelMat);
            barrel1.position.set(x, 0.6, z);
            barrel1.castShadow = true;
            scene.add(barrel1);
            
            const barrel2 = new THREE.Mesh(barrelGeo, barrelMat);
            barrel2.position.set(x+1.1, 0.6, z+0.2);
            barrel2.castShadow = true;
            scene.add(barrel2);
        }
        createBarrels(12, -10);
        createBarrels(-11, 14);

        // Glowing Forge
        const forgeGeo = new THREE.BoxGeometry(3, 2, 3);
        const forgeMat = new THREE.MeshStandardMaterial({ map: stoneWallTex });
        const forge = new THREE.Mesh(forgeGeo, forgeMat);
        forge.position.set(15, 1, 10);
        forge.castShadow = true;
        scene.add(forge);
        
        const lavaGeo = new THREE.PlaneGeometry(2, 2);
        const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
        const lava = new THREE.Mesh(lavaGeo, lavaMat);
        lava.rotation.x = -Math.PI / 2;
        lava.position.set(15, 2.05, 10);
        scene.add(lava);
        createTorch(15, 10, 0xff4400, 3, 20); // Forge light

        // Characters
        const npcs = [];
        function createCharacter(name, color, x, z, isPlayer = false) {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5/2 + 0.5;
            body.castShadow = true;
            group.add(body);
            
            const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.5 + 0.5 + 0.35;
            head.castShadow = true;
            group.add(head);

            group.position.set(x, 0.5, z); // Start slightly above ground
            scene.add(group);

            const label = document.createElement('div');
            label.className = 'npc-label';
            label.textContent = name;
            label.style.color = isPlayer ? '#00ff00' : '#ffff00';
            labelsContainer.appendChild(label);

            const charData = {
                name: name,
                group: group,
                label: label,
                isPlayer: isPlayer,
                message: `Hello, I am ${name}.`
            };
            
            const hitGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
            const hitMat = new THREE.MeshBasicMaterial({ visible: false });
            const hitMesh = new THREE.Mesh(hitGeo, hitMat);
            hitMesh.position.y = 1.25;
            hitMesh.userData = charData;
            charData.hitMesh = hitMesh;
            group.add(hitMesh);

            if (!isPlayer) npcs.push(charData);

            return charData;
        }


        const player = createCharacter('Player', 0x336699, 0, 5, true); // Blue shirt
        const cook = createCharacter('Cook', 0xdddddd, -5, 5); cook.message = "Best pies in Varrock, right here!"; // White chef
        const banker = createCharacter('Banker', 0x222222, -10, -5); banker.message = "Welcome to the Bank of Gielinor."; // Black robes
        const shopkeeper = createCharacter('Shopkeeper', 0x55aa55, 10, -5); shopkeeper.message = "Fancy a look at my wares?"; // Green shirt

        // Movement Logic
        
        // Interaction Logic
        const labelsContainer = document.getElementById('labels-container');
        function addChatMessage(msg, color) {
            const chatBox = document.querySelector('.chat-messages');
            if (chatBox) {
                const p = document.createElement('p');
                p.innerHTML = `<span style="color: ${color || '#fff'}">${msg}</span>`;
                chatBox.appendChild(p);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPosition = null;

        // Label update function
        function updateLabels() {
            const allChars = [player, ...npcs];
            allChars.forEach(char => {
                const pos = char.group.position.clone();
                pos.y += (char.isPlayer ? 4.0 : 3.2); // Player label higher
                pos.project(camera);
                
                const x = (pos.x * .5 + .5) * window.innerWidth;
                const y = (pos.y * -.5 + .5) * window.innerHeight;
                
                char.label.style.left = `${x}px`;
                char.label.style.top = `${y}px`;
                char.label.style.display = pos.z > 1 ? 'none' : 'block';
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('#ui-container')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Check for NPC clicks first
            const npcHitboxes = npcs.map(n => n.hitMesh);
            const npcIntersects = raycaster.intersectObjects(npcHitboxes);
            if (npcIntersects.length > 0) {
                const npcData = npcIntersects[0].object.userData;
                addChatMessage(`[${npcData.name}]: ${npcData.message}`, '#ffff00');
                player.group.lookAt(npcData.group.position.x, player.group.position.y, npcData.group.position.z);
                targetPosition = null; // Stop moving
                return;
            }

            // If no NPC, check ground
            const intersects = raycaster.intersectObjects([ground, square]);
            if (intersects.length > 0) {
                targetPosition = intersects[0].point.clone();
                targetPosition.y = player.group.position.y; // Keep player on their current Y plane

                // Add yellow click marker
                const clickGeo = new THREE.RingGeometry(0.2, 0.4, 16);
                const clickMat = new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide });
                const clickMesh = new THREE.Mesh(clickGeo, clickMat);
                clickMesh.rotation.x = -Math.PI / 2;
                clickMesh.position.copy(targetPosition);
                clickMesh.position.y += 0.1;
                scene.add(clickMesh);
                setTimeout(() => scene.remove(clickMesh), 300);
            }
        });

        const clock = new THREE.Clock();

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Move player
            if (targetPosition) {
                const speed = 15; // units per second
                const distanceToTarget = player.position.distanceTo(targetPosition);
                
                if (distanceToTarget > 0.1) {
                    const direction = targetPosition.clone().sub(player.position).normalize();
                    player.position.add(direction.multiplyScalar(speed * delta));
                } else {
                    targetPosition = null;
                }
            }
            
            // Smooth camera follow
            const cameraOffset = new THREE.Vector3(30, 30, 30);
            const targetCameraPosition = player.position.clone().add(cameraOffset);
            camera.position.lerp(targetCameraPosition, 0.05);
            camera.lookAt(player.position);

            updateLabels();
            composer.render(delta);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
