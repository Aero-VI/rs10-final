<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScape 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container"></div>
    <canvas id="game-canvas"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x334455);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        const aspect = window.innerWidth / window.innerHeight;
        const d = 20;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(scene.position);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Textures (same as before) ---
        function createGrassTexture(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');x.fillStyle='#4B5320';x.fillRect(0,0,512,512);for(let i=0;i<20000;i++){const a=Math.random()*512,b=Math.random()*512,s=40+Math.random()*40;x.fillStyle="rgba("+(s-20)+","+(s+20)+","+(s-20)+",0.2)";x.fillRect(a,b,2,2)}return new THREE.CanvasTexture(c)}
        function createCobblestoneTexture(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');x.fillStyle='#555';x.fillRect(0,0,512,512);for(let i=0;i<150;i++){const a=Math.random()*512,b=Math.random()*512,sX=40+Math.random()*50,sY=30+Math.random()*40,ang=Math.random()*Math.PI,g=100+Math.random()*30;x.fillStyle="rgb("+g+","+g+","+g+")";x.save();x.translate(a,b);x.rotate(ang);x.fillRect(-sX/2,-sY/2,sX,sY);x.restore()}return new THREE.CanvasTexture(c)}
        function createStoneWallTexture(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');x.fillStyle='#606060';x.fillRect(0,0,512,512);for(let y=0;y<512;y+=32){for(let a=0;a<512;a+=64){const o=(y/32)%2===0?0:32,g=120+Math.random()*20;x.fillStyle="rgb("+g+","+g+","+g+")";x.fillRect(a+o,y,64,32);x.strokeStyle='#444';x.strokeRect(a+o,y,64,32)}}return new THREE.CanvasTexture(c)}
        const grassTexture=createGrassTexture(),cobblestoneTexture=createCobblestoneTexture(),stoneWallTexture=createStoneWallTexture();
        grassTexture.wrapS=cobblestoneTexture.wrapS=stoneWallTexture.wrapS=THREE.RepeatWrapping;
        grassTexture.wrapT=cobblestoneTexture.wrapT=stoneWallTexture.wrapT=THREE.RepeatWrapping;
        grassTexture.repeat.set(4,4);cobblestoneTexture.repeat.set(2,2);stoneWallTexture.repeat.set(2,2);

        // --- World ---
        const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshLambertMaterial({map:grassTexture}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
        const path=new THREE.Mesh(new THREE.PlaneGeometry(8,50),new THREE.MeshLambertMaterial({map:cobblestoneTexture}));path.rotation.x=-Math.PI/2;path.position.y=0.01;path.receiveShadow=true;scene.add(path);
        function createBuilding(x,z,w,d,h){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({map:stoneWallTexture}));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);return b}
        const bank=createBuilding(-10,0,8,12,10),shop=createBuilding(10,10,10,8,8),weaponsmith=createBuilding(10,-10,6,6,7);

        // --- Player ---
        const playerGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
        const playerMat = new THREE.MeshStandardMaterial({color: 0x00aaff});
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 10);
        player.castShadow = true;
        scene.add(player);
        
        let targetPosition = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        
        renderer.domElement.addEventListener('click', (event) => {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            
            if (intersects.length > 0) {
                targetPosition.copy(intersects[0].point);
            }
        });

        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Player movement
            const distance = player.position.distanceTo(targetPosition);
            if (distance > 0.1) {
                const direction = targetPosition.clone().sub(player.position).normalize();
                player.position.add(direction.multiplyScalar(0.1));
            }
            
            // Camera follow
            camera.position.x = player.position.x + 20;
            camera.position.z = player.position.z + 20;
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
