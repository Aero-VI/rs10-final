<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScape 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-overlay">
        <h1>RuneScape 10</h1>
        <div class="subtitle">Loading — please wait...</div>
        <div class="loading-bar-outer"><div class="loading-bar-inner" id="loading-bar"></div></div>
    </div>

    <!-- NPC/Player labels rendered here -->
    <div id="labels-container"></div>

    <!-- Right-Click Context Menu -->
    <div id="context-menu">
        <div class="menu-title">Choose Option</div>
        <div id="context-menu-items"></div>
    </div>

    <div id="ui-container">
        <!-- Top left: Orbs -->
        <div id="top-bar">
            <div class="orb-wrapper">
                <div class="orb hp-orb"><div class="orb-fill"></div><span class="orb-icon">❤</span></div>
                <span class="orb-text">10/10</span>
            </div>
            <div class="orb-wrapper">
                <div class="orb prayer-orb"><div class="orb-fill"></div><span class="orb-icon">✦</span></div>
                <span class="orb-text">1/1</span>
            </div>
            <div class="orb-wrapper">
                <div class="orb run-orb"><div class="orb-fill"></div><span class="orb-icon">🏃</span></div>
                <span class="orb-text">100%</span>
            </div>
        </div>

        <!-- Chat Box -->
        <div id="chat-box">
            <div class="chat-tabs">
                <button class="chat-tab active">All</button>
                <button class="chat-tab">Game</button>
                <button class="chat-tab">Public</button>
                <button class="chat-tab">Private</button>
                <button class="chat-tab">Clan</button>
                <button class="chat-tab">Trade</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <p><span class="sys">Welcome to RuneScape 10.</span></p>
                <p><span class="sys">The graphics are finally good.</span></p>
            </div>
            <div class="chat-input" id="chat-input">Press Enter to chat...</div>
        </div>

        <!-- Right Panel -->
        <div id="right-panel-container">
            <div id="minimap-wrapper">
                <div id="compass">N</div>
                <div id="minimap-border">
                    <div id="minimap-inner">
                        <canvas id="minimap-canvas" width="192" height="192"></canvas>
                    </div>
                </div>
                <div id="world-map-btn">🗺</div>
            </div>
            <div id="side-panel">
                <div class="panel-tabs">
                    <button class="tab active" data-panel="inv">🎒</button>
                    <button class="tab" data-panel="combat">⚔️</button>
                    <button class="tab" data-panel="stats">📊</button>
                    <button class="tab" data-panel="quest">📜</button>
                    <button class="tab" data-panel="prayer">✦</button>
                    <button class="tab" data-panel="magic">✨</button>
                    <button class="tab" data-panel="settings">⚙️</button>
                </div>
                <div class="panel-content" id="panel-content">
                    <div class="inventory-grid" id="inventory-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // ═══════ LOADING ═══════
        const loadBar = document.getElementById('loading-bar');
        const loadOverlay = document.getElementById('loading-overlay');
        let loadProgress = 0;
        function setLoad(pct) { loadProgress = pct; loadBar.style.width = pct + '%'; }

        // ═══════ INVENTORY SETUP ═══════
        const invGrid = document.getElementById('inventory-grid');
        for (let i = 0; i < 28; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            invGrid.appendChild(slot);
        }

        // ═══════ SCENE ═══════
        const scene = new THREE.Scene();
        // RS-style bright blue sky
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 80, 160);
        setLoad(10);

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        setLoad(20);

        // ═══════ CAMERA (isometric like RS) ═══════
        const aspect = window.innerWidth / window.innerHeight;
        const d = 18;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 500);
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // ═══════ LIGHTING (bright, warm RS daytime) ═══════
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x556B2F, 0.6);
        scene.add(hemiLight);

        // Main sun
        const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.8);
        sunLight.position.set(50, 60, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.bias = -0.0003;
        scene.add(sunLight);

        // Fill light
        const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
        fillLight.position.set(-30, 20, -30);
        scene.add(fillLight);
        setLoad(30);

        // ═══════ POST-PROCESSING ═══════
        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3, 0.4, 0.9
        );
        bloomPass.threshold = 0.85;
        bloomPass.strength = 0.3;
        bloomPass.radius = 0.4;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);

        // ═══════ TEXTURE GENERATORS ═══════
        function createGrassTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            // Base green — RS-style bright grass
            ctx.fillStyle = '#4a8c28';
            ctx.fillRect(0, 0, 512, 512);
            // Variation
            for (let i = 0; i < 40000; i++) {
                const shade = Math.random();
                if (shade < 0.3) ctx.fillStyle = '#3d7a1f';
                else if (shade < 0.6) ctx.fillStyle = '#5a9e32';
                else if (shade < 0.85) ctx.fillStyle = '#4a8c28';
                else ctx.fillStyle = '#68af40';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 3 + Math.random() * 5);
            }
            // Small dirt patches
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = `rgba(100,80,50,${0.15 + Math.random() * 0.1})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, 3 + Math.random() * 8, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(16, 16);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createDirtPathTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 5000; i++) {
                const v = Math.random();
                ctx.fillStyle = v < 0.5 ? '#7a6347' : '#9c8463';
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 1 + Math.random() * 2);
            }
            // Pebbles
            for (let i = 0; i < 30; i++) {
                const g = 120 + Math.random() * 60;
                ctx.fillStyle = `rgb(${g},${g-10},${g-20})`;
                ctx.beginPath();
                ctx.arc(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createCobbleTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#888078';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 600; i++) {
                const gray = 100 + Math.random() * 80;
                const warm = Math.random() * 15;
                ctx.fillStyle = `rgb(${gray + warm},${gray},${gray - warm})`;
                ctx.beginPath();
                ctx.ellipse(
                    Math.random() * 512, Math.random() * 512,
                    10 + Math.random() * 14, 8 + Math.random() * 10,
                    Math.random() * Math.PI, 0, Math.PI * 2
                );
                ctx.fill();
                ctx.strokeStyle = `rgba(0,0,0,0.3)`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createStoneTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#9e9585';
            ctx.fillRect(0, 0, 512, 512);
            // Stone brick pattern
            for (let y = 0; y < 512; y += 40) {
                for (let x = 0; x < 512; x += 80) {
                    const off = ((y / 40) % 2) * 40;
                    const gray = 130 + Math.random() * 50;
                    const warm = Math.random() * 20;
                    ctx.fillStyle = `rgb(${gray + warm}, ${gray + warm * 0.5}, ${gray - warm * 0.3})`;
                    ctx.fillRect(x + off + 2, y + 2, 76, 36);
                    // Mortar lines
                    ctx.strokeStyle = '#706858';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + off + 1, y + 1, 78, 38);
                }
            }
            // Weathering
            for (let i = 0; i < 2000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 1, 1);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createWoodTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6b4226';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 300; i++) {
                const v = Math.random();
                ctx.fillStyle = v < 0.5 ? '#5a3518' : '#7a5232';
                ctx.fillRect(0, Math.random() * 256, 256, 1 + Math.random() * 2);
            }
            // Knots
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = '#4a2a12';
                ctx.beginPath();
                ctx.ellipse(Math.random() * 256, Math.random() * 256, 4, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createRoofTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 0, 256, 256);
            // Shingle rows
            for (let y = 0; y < 256; y += 16) {
                for (let x = 0; x < 256; x += 32) {
                    const off = ((y / 16) % 2) * 16;
                    const r = 100 + Math.random() * 40;
                    ctx.fillStyle = `rgb(${r + 20},${r * 0.5},${r * 0.2})`;
                    ctx.fillRect(x + off, y, 30, 14);
                    ctx.strokeStyle = '#5a2a08';
                    ctx.strokeRect(x + off, y, 30, 14);
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createWaterTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            const grd = ctx.createRadialGradient(128, 128, 20, 128, 128, 128);
            grd.addColorStop(0, '#5599dd');
            grd.addColorStop(1, '#3377bb');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 256, 256);
            // Ripples
            for (let i = 0; i < 20; i++) {
                ctx.strokeStyle = `rgba(180,220,255,${0.1 + Math.random() * 0.15})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(128, 128, 20 + i * 5, 0, Math.PI * 2);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const grassTex = createGrassTexture();
        const dirtTex = createDirtPathTexture();
        const cobbleTex = createCobbleTexture();
        const stoneTex = createStoneTexture();
        const woodTex = createWoodTexture();
        const roofTex = createRoofTexture();
        const waterTex = createWaterTexture();
        setLoad(50);

        // ═══════ WORLD GEOMETRY ═══════

        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9, metalness: 0.0 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Lumbridge-style town square
        const squareGeo = new THREE.PlaneGeometry(32, 32);
        const squareMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.75 });
        const square = new THREE.Mesh(squareGeo, squareMat);
        square.rotation.x = -Math.PI / 2;
        square.position.y = 0.06;
        square.receiveShadow = true;
        scene.add(square);

        // Dirt paths extending from square
        function createPath(x, z, w, h, rot) {
            const g = new THREE.PlaneGeometry(w, h);
            const m = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 0.85 });
            const mesh = new THREE.Mesh(g, m);
            mesh.rotation.x = -Math.PI / 2;
            if (rot) mesh.rotation.z = rot;
            mesh.position.set(x, 0.04, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }
        createPath(0, -24, 6, 16);   // South
        createPath(0, 24, 6, 16);    // North
        createPath(-24, 0, 16, 6, 0); // West (already correct since geometry is 16 wide)
        createPath(24, 0, 16, 6);     // East

        // ═══════ FOUNTAIN (centre of town) ═══════
        const fountainBase = new THREE.Mesh(
            new THREE.CylinderGeometry(4, 4.5, 1.2, 24),
            new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.8 })
        );
        fountainBase.position.set(0, 0.6, 0);
        fountainBase.castShadow = true; fountainBase.receiveShadow = true;
        scene.add(fountainBase);

        const fountainRim = new THREE.Mesh(
            new THREE.TorusGeometry(3.8, 0.3, 8, 24),
            new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.8 })
        );
        fountainRim.rotation.x = -Math.PI / 2;
        fountainRim.position.set(0, 1.25, 0);
        fountainRim.castShadow = true;
        scene.add(fountainRim);

        const waterSurface = new THREE.Mesh(
            new THREE.CircleGeometry(3.5, 24),
            new THREE.MeshStandardMaterial({
                map: waterTex, transparent: true, opacity: 0.85,
                roughness: 0.1, metalness: 0.3, color: 0x6699cc
            })
        );
        waterSurface.rotation.x = -Math.PI / 2;
        waterSurface.position.set(0, 1.15, 0);
        scene.add(waterSurface);

        // Fountain pillar
        const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.4, 3, 12),
            new THREE.MeshStandardMaterial({ map: stoneTex })
        );
        pillar.position.set(0, 2.7, 0);
        pillar.castShadow = true;
        scene.add(pillar);

        // ═══════ BUILDINGS ═══════
        function createBuilding(config) {
            const { w, h, depth, x, z, roofColor, wallTex: wTex, name, doorSide } = config;
            const group = new THREE.Group();

            // Walls
            const wallGeo = new THREE.BoxGeometry(w, h, depth);
            const wallMat = new THREE.MeshStandardMaterial({ map: wTex || stoneTex, roughness: 0.85 });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.y = h / 2;
            walls.castShadow = true; walls.receiveShadow = true;
            group.add(walls);

            // Roof (pyramid)
            const roofGeo = new THREE.ConeGeometry(Math.max(w, depth) * 0.75, h * 0.5, 4);
            const roofMat = new THREE.MeshStandardMaterial({ map: roofTex, color: roofColor || 0x8B4513, roughness: 0.9 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = h + h * 0.25;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            group.add(roof);

            // Door (dark opening)
            const doorGeo = new THREE.PlaneGeometry(1.5, 2.5);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 1 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            if (doorSide === 'south') { door.position.set(0, 1.25, depth / 2 + 0.05); }
            else if (doorSide === 'north') { door.position.set(0, 1.25, -depth / 2 - 0.05); door.rotation.y = Math.PI; }
            else if (doorSide === 'east') { door.position.set(w / 2 + 0.05, 1.25, 0); door.rotation.y = -Math.PI / 2; }
            else { door.position.set(-w / 2 - 0.05, 1.25, 0); door.rotation.y = Math.PI / 2; }
            group.add(door);

            // Windows (small yellow squares on each side)
            const winGeo = new THREE.PlaneGeometry(1, 1);
            const winMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0x443300, emissiveIntensity: 0.3, roughness: 0.5 });
            [[-1, depth / 2 + 0.05, 0], [1, depth / 2 + 0.05, 0],
             [-1, -depth / 2 - 0.05, Math.PI], [1, -depth / 2 - 0.05, Math.PI]].forEach(([ox, oz, ry]) => {
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(ox * (w * 0.3), h * 0.6, oz);
                win.rotation.y = ry || 0;
                group.add(win);
            });

            // Sign
            if (name) {
                const signPost = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 2.5, 6),
                    new THREE.MeshStandardMaterial({ map: woodTex })
                );
                signPost.position.set(doorSide === 'east' ? w / 2 + 1.5 : doorSide === 'west' ? -w / 2 - 1.5 : 2, 1.25, doorSide === 'south' ? depth / 2 + 1.5 : doorSide === 'north' ? -depth / 2 - 1.5 : 0);
                signPost.castShadow = true;
                group.add(signPost);

                const signBoard = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 1, 0.1),
                    new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.9 })
                );
                signBoard.position.copy(signPost.position);
                signBoard.position.y = 2.5;
                signBoard.castShadow = true;
                group.add(signBoard);
            }

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        // Bank of Gielinor
        createBuilding({ w: 14, h: 10, depth: 12, x: -18, z: -16, roofColor: 0x666666, name: 'Bank', doorSide: 'east' });
        // General Store
        createBuilding({ w: 10, h: 8, depth: 10, x: 18, z: -16, roofColor: 0x8B4513, name: 'Shop', doorSide: 'west' });
        // Cook's House
        createBuilding({ w: 9, h: 7, depth: 9, x: -18, z: 16, roofColor: 0xAA5522, name: 'Kitchen', doorSide: 'east' });
        // Smithy
        createBuilding({ w: 10, h: 7, depth: 8, x: 18, z: 16, roofColor: 0x555555, name: 'Smithy', doorSide: 'west' });
        setLoad(60);

        // ═══════ TREES (Low-poly RS style) ═══════
        function createTree(x, z, size) {
            const s = size || 1;
            const group = new THREE.Group();

            // Trunk
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3 * s, 0.5 * s, 3 * s, 6),
                new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.95 })
            );
            trunk.position.y = 1.5 * s;
            trunk.castShadow = true;
            group.add(trunk);

            // Canopy layers (stacked cones — RS style)
            const leafColors = [0x2d6b1a, 0x3a8525, 0x2a5f15];
            for (let i = 0; i < 3; i++) {
                const canopy = new THREE.Mesh(
                    new THREE.ConeGeometry((2.5 - i * 0.4) * s, (2 - i * 0.3) * s, 7 + i),
                    new THREE.MeshStandardMaterial({ color: leafColors[i], roughness: 0.9 })
                );
                canopy.position.y = (3 + i * 1.2) * s;
                canopy.castShadow = true;
                group.add(canopy);
            }

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        // Forest trees around the town
        const treePositions = [
            [-35, -25, 1.2], [-40, -10, 1], [-38, 5, 1.3], [-42, 20, 1.1], [-35, 30, 1],
            [35, -25, 1.1], [40, -12, 1.2], [38, 8, 1], [42, 22, 1.3], [35, 32, 1.1],
            [-30, -35, 1], [-20, -38, 1.2], [0, -38, 1.1], [20, -38, 1], [30, -35, 1.2],
            [-28, 35, 1.1], [-15, 38, 1], [5, 38, 1.2], [22, 38, 1.1], [32, 35, 1],
            // More distant trees
            [-50, -40, 1.3], [-55, 0, 1.1], [-48, 35, 1.2], [50, -38, 1.1], [55, 5, 1.3],
            [48, 40, 1], [-45, -50, 1], [45, -50, 1.2], [-50, 50, 1.1], [50, 50, 1.3],
            [-60, -20, 1], [60, 20, 1.2], [-58, 25, 1.1], [58, -25, 1],
        ];
        treePositions.forEach(([x, z, s]) => createTree(x, z, s));

        // ═══════ DEAD TREES (RS-style) ═══════
        function createDeadTree(x, z) {

        // ═══════ FENCE ═══════
        function createFenceSegment(x1, z1, x2, z2) {
            const dx = x2 - x1, dz = z2 - z1;
            const len = Math.sqrt(dx * dx + dz * dz);
            const angle = Math.atan2(dx, dz);
            const numPosts = Math.floor(len / 2);

            for (let i = 0; i <= numPosts; i++) {
                const t = i / numPosts;
                const px = x1 + dx * t, pz = z1 + dz * t;
                const post = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.06, 0.08, 1.2, 5),
                    new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.95 })
                );
                post.position.set(px, 0.6, pz);
                post.castShadow = true;
                scene.add(post);
            }
            // Cross rails
            for (let r = 0; r < 2; r++) {
                const rail = new THREE.Mesh(
                    new THREE.BoxGeometry(0.06, 0.06, len),
                    new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.95 })
                );
                rail.position.set((x1 + x2) / 2, 0.4 + r * 0.5, (z1 + z2) / 2);
                rail.rotation.y = angle;
                rail.castShadow = true;
                scene.add(rail);
            }
        }

        // ═══════ NPC PATROLLING ═══════
        function updateNPCs(delta) {
            npcs.forEach(npc => {
                npc.patrolTimer -= delta;
                if (npc.patrolTimer <= 0) {
                    // Pick a new patrol point near their center
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 1 + Math.random() * 3;
                    npc.patrolTarget = new THREE.Vector3(
                        npc.patrolCenter.x + Math.cos(angle) * dist,
                        0,
                        npc.patrolCenter.z + Math.sin(angle) * dist
                    );
                    npc.patrolTimer = 3 + Math.random() * 5;
                }

                if (npc.patrolTarget) {
                    const dir = npc.patrolTarget.clone().sub(npc.group.position);
                    dir.y = 0;
                    if (dir.length() > 0.2) {
                        dir.normalize().multiplyScalar(1.5 * delta);
                        npc.group.position.add(dir);
                        // Face direction
                        npc.group.lookAt(
                            npc.patrolTarget.x,
                            npc.group.position.y,
                            npc.patrolTarget.z
                        );
                    }
                }

                // Idle bob
                npc.idleAnim += delta * 2;
                npc.group.position.y = Math.sin(npc.idleAnim) * 0.02;
            });
        }

        // ═══════ MINIMAP ═══════
        const minimapCanvas = document.getElementById('minimap-canvas');
        const mmCtx = minimapCanvas.getContext('2d');

        function renderMinimap() {
            const size = 192;
            const scale = size / 120; // Map 120 world-units to full minimap
            const cx = size / 2 - player.group.position.x * scale;
            const cz = size / 2 - player.group.position.z * scale;

            mmCtx.clearRect(0, 0, size, size);

            // Background (grass)
            mmCtx.fillStyle = '#3a7a20';
            mmCtx.fillRect(0, 0, size, size);

            // Cobble square
            mmCtx.fillStyle = '#888078';
            mmCtx.fillRect(cx - 16 * scale, cz - 16 * scale, 32 * scale, 32 * scale);

            // Paths
            mmCtx.fillStyle = '#8B7355';
            mmCtx.fillRect(cx - 3 * scale, cz - 32 * scale, 6 * scale, 64 * scale);
            mmCtx.fillRect(cx - 32 * scale, cz - 3 * scale, 64 * scale, 6 * scale);

            // Buildings
            const buildings = [
                { x: -18, z: -16, w: 14, d: 12, c: '#aaa' },
                { x: 18, z: -16, w: 10, d: 10, c: '#a88' },
                { x: -18, z: 16, w: 9, d: 9, c: '#8a6' },
                { x: 18, z: 16, w: 10, d: 8, c: '#888' },
            ];
            buildings.forEach(b => {
                mmCtx.fillStyle = b.c;
                mmCtx.fillRect(
                    cx + (b.x - b.w / 2) * scale,
                    cz + (b.z - b.d / 2) * scale,
                    b.w * scale, b.d * scale
                );
            });

            // Trees
            mmCtx.fillStyle = '#1a5a10';
            treePositions.forEach(([tx, tz]) => {
                mmCtx.beginPath();
                mmCtx.arc(cx + tx * scale, cz + tz * scale, 2, 0, Math.PI * 2);
                mmCtx.fill();
            });

            // Fountain
            mmCtx.fillStyle = '#5599dd';
            mmCtx.beginPath();
            mmCtx.arc(cx, cz, 3 * scale, 0, Math.PI * 2);
            mmCtx.fill();

            // NPCs (yellow dots)
            mmCtx.fillStyle = '#ffff00';
            npcs.forEach(npc => {
                mmCtx.beginPath();
                mmCtx.arc(cx + npc.group.position.x * scale, cz + npc.group.position.z * scale, 2, 0, Math.PI * 2);
                mmCtx.fill();
            });

            // Player (white arrow)
            mmCtx.fillStyle = '#ffffff';
            mmCtx.beginPath();
            mmCtx.arc(size / 2, size / 2, 3, 0, Math.PI * 2);
            mmCtx.fill();
            mmCtx.strokeStyle = '#000';
            mmCtx.lineWidth = 1;
            mmCtx.stroke();

            // Circular mask
            mmCtx.globalCompositeOperation = 'destination-in';
            mmCtx.beginPath();
            mmCtx.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
            mmCtx.fill();
            mmCtx.globalCompositeOperation = 'source-over';
        }

        // ═══════ PARTICLES (fire, water) ═══════
        const particleSystems = [];

        // Fire particles for forge
        function createFireParticles(x, y, z) {
            const count = 30;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            for (let i = 0; i < count; i++) {
                positions[i * 3] = x + (Math.random() - 0.5) * 1.5;
                positions[i * 3 + 1] = y + Math.random() * 0.5;
                positions[i * 3 + 2] = z + (Math.random() - 0.5) * 1.5;
                velocities.push({ vy: 0.5 + Math.random() * 1.5, life: Math.random() });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.15, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
            const points = new THREE.Points(geo, mat);
            scene.add(points);
            particleSystems.push({ points, velocities, origin: { x, y, z }, count });
        }
        createFireParticles(22, 2.2, 12);

        // Fountain splash particles
        function createWaterParticles(x, y, z) {
            const count = 20;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                positions[i * 3] = x + Math.cos(angle) * 0.3;
                positions[i * 3 + 1] = y + Math.random() * 2;
                positions[i * 3 + 2] = z + Math.sin(angle) * 0.3;
                velocities.push({ vx: Math.cos(angle) * 0.3, vy: 1 + Math.random(), vz: Math.sin(angle) * 0.3, life: Math.random() });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0x88bbff, size: 0.1, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
            const points = new THREE.Points(geo, mat);
            scene.add(points);
            particleSystems.push({ points, velocities, origin: { x, y, z }, count, isWater: true });
        }
        createWaterParticles(0, 4.2, 0);

        function updateParticles(delta) {
            particleSystems.forEach(sys => {
                const pos = sys.points.geometry.attributes.position.array;
                for (let i = 0; i < sys.count; i++) {
                    const v = sys.velocities[i];
                    v.life -= delta * (sys.isWater ? 0.8 : 1.2);
                    pos[i * 3 + 1] += v.vy * delta;
                    if (sys.isWater) {
                        pos[i * 3] += (v.vx || 0) * delta;
                        pos[i * 3 + 2] += (v.vz || 0) * delta;
                        v.vy -= 2 * delta; // gravity
                    }
                    if (v.life <= 0) {
                        // Reset particle
                        if (sys.isWater) {
                            const angle = Math.random() * Math.PI * 2;
                            pos[i * 3] = sys.origin.x + Math.cos(angle) * 0.2;
                            pos[i * 3 + 1] = sys.origin.y;
                            pos[i * 3 + 2] = sys.origin.z + Math.sin(angle) * 0.2;
                            v.vx = Math.cos(angle) * 0.3;
                            v.vy = 1 + Math.random() * 1.5;
                            v.vz = Math.sin(angle) * 0.3;
                        } else {
                            pos[i * 3] = sys.origin.x + (Math.random() - 0.5) * 1.5;
                            pos[i * 3 + 1] = sys.origin.y;
                            pos[i * 3 + 2] = sys.origin.z + (Math.random() - 0.5) * 1.5;
                            v.vy = 0.5 + Math.random() * 1.5;
                        }
                        v.life = 0.5 + Math.random() * 0.5;
                    }
                }
                sys.points.geometry.attributes.position.needsUpdate = true;
            });
        }

        // ═══════ GAME LOOP ═══════
        setLoad(100);
        setTimeout(() => loadOverlay.classList.add('hidden'), 400);

        const clock = new THREE.Clock();
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            time += delta;

            // Move player
            if (targetPosition) {
                const speed = 8;
                const dir = targetPosition.clone().sub(player.group.position);
                dir.y = 0;
                if (dir.length() > 0.2) {
                    player.group.lookAt(targetPosition.x, player.group.position.y, targetPosition.z);
                    dir.normalize().multiplyScalar(speed * delta);
                    player.group.position.add(dir);
                } else {
                    targetPosition = null;
                }
            }

            // NPCs patrol
            updateNPCs(delta);

            // Camera follow (smooth)
            const camOffset = new THREE.Vector3(30, 30, 30);
            const targetCam = player.group.position.clone().add(camOffset);
            camera.position.lerp(targetCam, 0.06);
            camera.lookAt(player.group.position);

            // Torch flicker
            torchLights.forEach(t => {
                const flicker = t.baseIntensity + Math.sin(time * 10 + Math.random() * 0.5) * 0.3;
                t.light.intensity = flicker;
                if (t.flame) {
                    t.flame.scale.setScalar(0.9 + Math.sin(time * 12) * 0.15);
                }
            });

            // Water shimmer
            waterSurface.material.opacity = 0.8 + Math.sin(time * 2) * 0.05;

            // Particles
            updateParticles(delta);

            // Labels
            updateLabels();

            // Minimap
            renderMinimap();

            composer.render(delta);
        }
        animate();

        // ═══════ RESIZE ═══════
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
