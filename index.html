<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScape 10</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; overflow: hidden; background-color: #000; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- Top left: Stats/HP -->
        <div id="top-bar">
            <div class="orb hp-orb">❤ 10</div>
            <div class="orb prayer-orb">✨ 1</div>
            <div class="orb run-orb">🏃 100</div>
        </div>

        <!-- Bottom left: Chat -->
        <div id="chat-box">
            <div class="chat-messages">
                <p><span class="sys">Welcome to RuneScape 10.</span></p>
                <p><span class="sys">The graphics are finally good.</span></p>
            </div>
            <div class="chat-input">Press Enter to chat...</div>
        </div>

        <!-- Right side: Minimap and Panels -->
        <div id="right-panel-container">
            <div id="minimap-border">
                <div id="minimap-inner">
                    <!-- Minimap canvas would go here -->
                </div>
            </div>
            <div id="side-panel">
                <div class="panel-tabs">
                    <button class="tab active">🎒</button>
                    <button class="tab">⚔️</button>
                    <button class="tab">📊</button>
                    <button class="tab">⚙️</button>
                </div>
                <div class="panel-content">
                    <div class="inventory-grid">
                        <!-- 28 slots -->
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                        <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0f0a); // Dark, moody evening
        scene.fog = new THREE.FogExp2(0x1a0f0a, 0.015);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // Camera setup (isometric)
        const aspect = window.innerWidth / window.innerHeight;
        const d = 20;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0x2a2a3a, 0x0f0a05, 0.4);
        scene.add(hemiLight);

        // Sun / God ray source
        const dirLight = new THREE.DirectionalLight(0xffaa55, 1.5);
        dirLight.position.set(40, 30, -40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Local Point Lights (Torches)
        function createTorch(x, z) {
            const light = new THREE.PointLight(0xff6600, 2, 15);
            light.position.set(x, 2, z);
            light.castShadow = true;
            scene.add(light);
            return light;
        }
        createTorch(-8, -8);
        createTorch(8, -8);

        // Post-Processing (Bloom for glowing effects)
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.5;
        bloomPass.strength = 1.2; // Intense bloom like the screenshot
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Procedural Textures
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2b3b14'; ctx.fillRect(0, 0, 512, 512); // Darker base grass
            for(let i=0; i<30000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#1a2a0a' : '#3a4d13';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 6);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(20, 20);
            return tex;
        }

        function createCobbleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 512, 512);
            for(let i=0; i<800; i++) {
                const gray = 60 + Math.random()*50;
                ctx.fillStyle = \`rgb(\${gray},\${gray},\${gray})\`;
                ctx.beginPath();
                ctx.ellipse(Math.random()*512, Math.random()*512, 8+Math.random()*12, 6+Math.random()*8, Math.random()*Math.PI, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }
        
        function createStoneWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#555'; ctx.fillRect(0, 0, 512, 512);
            for(let y=0; y<512; y+=32) {
                for(let x=0; x<512; x+=64) {
                    const offset = (y/32)%2===0 ? 0 : 32;
                    const gray = 80 + Math.random()*40;
                    ctx.fillStyle = \`rgb(\${gray},\${gray},\${gray})\`;
                    ctx.fillRect(x + offset + 2, y + 2, 60, 28);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const grassTex = createGrassTexture();
        const cobbleTex = createCobbleTexture();
        const stoneWallTex = createStoneWallTexture();

        // World Generation
        const groundGeo = new THREE.PlaneGeometry(120, 120);
        const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Town Square (Cobblestone)
        const squareGeo = new THREE.PlaneGeometry(40, 40);
        const squareMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.7, metalness: 0.2 });
        const square = new THREE.Mesh(squareGeo, squareMat);
        square.rotation.x = -Math.PI / 2;
        square.position.y = 0.05;
        square.receiveShadow = true;
        scene.add(square);
        
        // Central Fountain
        const fountainGeo = new THREE.CylinderGeometry(3, 4, 1.5, 16);
        const fountainMat = new THREE.MeshStandardMaterial({ map: stoneWallTex });
        const fountain = new THREE.Mesh(fountainGeo, fountainMat);
        fountain.position.set(0, 0.75, 0);
        fountain.castShadow = true;
        fountain.receiveShadow = true;
        scene.add(fountain);
        
        const waterGeo = new THREE.CylinderGeometry(2.8, 2.8, 1.6, 16);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.8 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(0, 0.8, 0);
        scene.add(water);

        // Buildings
        function createBuilding(w, h, d, x, z, tex) {
            const group = new THREE.Group();
            
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, h/2, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            
            // Roof
            const roofGeo = new THREE.ConeGeometry(w*0.8, h*0.5, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, h + h*0.25, 0);
            roof.rotation.y = Math.PI/4;
            roof.castShadow = true;
            group.add(roof);
            
            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        // Bank
        createBuilding(12, 10, 12, -15, -15, stoneWallTex);
        // Shop
        createBuilding(10, 8, 10, 15, -15, stoneWallTex);
        // Cook's House
        createBuilding(8, 7, 8, -15, 15, stoneWallTex);

        // Characters
        function createCharacter(color, x, z) {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5/2 + 0.5;
            body.castShadow = true;
            group.add(body);
            
            // Head
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.5 + 0.5 + 0.4;
            head.castShadow = true;
            group.add(head);

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        const player = createCharacter(0x336699, 0, 0); // Blue shirt
        const cook = createCharacter(0xffffff, -5, 5); // White chef
        const banker = createCharacter(0x222222, -10, -5); // Black robes
        const shopkeeper = createCharacter(0x55aa55, 10, -5); // Green shirt

        // Movement Logic
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPosition = null;
        const playerSpeed = 0.15;

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([ground, square]);
            
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.y = 0; // Keep on ground
            }
        });

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move player
            if (targetPosition) {
                const dx = targetPosition.x - player.position.x;
                const dz = targetPosition.z - player.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist > 0.2) {
                    const speed = 0.15;
                    player.position.x += (dx/dist) * speed;
                    player.position.z += (dz/dist) * speed;
                } else {
                    targetPosition = null;
                }
            }
            
            // Smooth camera follow
            const cameraTarget = new THREE.Vector3(player.position.x, 0, player.position.z);
            camera.position.lerp(cameraTarget.clone().add(new THREE.Vector3(30, 30, 30)), 0.05);
            camera.lookAt(cameraTarget);

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
