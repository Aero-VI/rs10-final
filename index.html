<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneScape 10</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; overflow: hidden; background-color: #000; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui-container"></div>
    <canvas id="game-canvas"></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.02);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Camera setup (isometric)
        const aspect = window.innerWidth / window.innerHeight;
        const d = 25;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, -20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Procedural Textures
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4a5d23'; ctx.fillRect(0, 0, 512, 512);
            for(let i=0; i<15000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#3a4d13' : '#5a6d33';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 8);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(10, 10);
            return tex;
        }

        function createCobbleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#333'; ctx.fillRect(0, 0, 512, 512);
            for(let i=0; i<400; i++) {
                const gray = 80 + Math.random()*40;
                ctx.fillStyle = \`rgb(\${gray},\${gray},\${gray})\`;
                ctx.beginPath();
                ctx.arc(Math.random()*512, Math.random()*512, 10+Math.random()*15, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        const grassTex = createGrassTexture();
        const cobbleTex = createCobbleTexture();

        // World Generation
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Town Square (Cobblestone)
        const squareGeo = new THREE.PlaneGeometry(30, 30);
        const squareMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.6 });
        const square = new THREE.Mesh(squareGeo, squareMat);
        square.rotation.x = -Math.PI / 2;
        square.position.y = 0.05;
        square.receiveShadow = true;
        scene.add(square);

        // Buildings
        function createBuilding(w, h, d, x, z, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        // Bank
        createBuilding(10, 8, 8, -10, -10, 0x8B7355);
        // Shop
        createBuilding(8, 7, 8, 10, -10, 0xA0522D);

        // Characters
        function createCharacter(color, x, z) {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5/2 + 0.5;
            body.castShadow = true;
            group.add(body);
            
            // Head
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.5 + 0.5 + 0.4;
            head.castShadow = true;
            group.add(head);

            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        const player = createCharacter(0x336699, 0, 0); // Blue shirt
        const cook = createCharacter(0xffffff, -5, 5); // White chef
        const banker = createCharacter(0x222222, -10, -5); // Black robes
        const shopkeeper = createCharacter(0x55aa55, 10, -5); // Green shirt

        // Movement Logic
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetPosition = null;
        const playerSpeed = 0.15;

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([ground, square]);
            
            if (intersects.length > 0) {
                targetPosition = intersects[0].point;
                targetPosition.y = 0; // Keep on ground
            }
        });

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Move player
            if (targetPosition) {
                const dx = targetPosition.x - player.position.x;
                const dz = targetPosition.z - player.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist > 0.1) {
                    player.position.x += (dx/dist) * playerSpeed;
                    player.position.z += (dz/dist) * playerSpeed;
                    // Camera follow
                    camera.position.x = player.position.x + 30;
                    camera.position.z = player.position.z + 30;
                    camera.lookAt(player.position);
                } else {
                    targetPosition = null;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
